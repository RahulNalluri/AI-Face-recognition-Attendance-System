<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AttendAI Student{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar student-topbar">
    <a class="brand" href="{{ url_for('student_portal') if current_user else url_for('login') }}"><span class="brand-mark">A</span><span>AttendAI Student</span></a>
    {% if current_user %}
      <div class="header-actions">
        <span class="student-name">{{ current_user.display_name }}</span>
        <a href="{{ url_for('change_password') }}">Change password</a>
        <form action="{{ url_for('logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="button" type="submit">Sign out</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main class="page student-page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
