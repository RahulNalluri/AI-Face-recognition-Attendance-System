<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AttendAI Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">A</span><span>AttendAI</span></a>
    <div class="header-actions"><a href="{{ url_for('class_groups_page') }}">Class groups</a><a href="{{ url_for('recognition_validation') }}">Recognition validation</a><a href="{{ url_for('session_history') }}">Session history</a><span class="local-label"><span class="live-dot"></span> Local attendance monitor</span></div>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
